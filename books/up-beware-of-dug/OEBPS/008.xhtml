  <head>
    <title>Beware of Dug</title>
    <meta name="viewport" content="width=738, height=738" />

  <div class="page">
  <img src="images/008.jpg" alt="" />  <div class="text-frame" style="left:74px; top:51px; width:621px; height:84px;">    <p>      <span class="font-5">        <span id="w121">	Suddenly,</span>        <span id="w122">a</span>        <span id="w123">giant</span>        <span id="w124">bird</span>        <span id="w125">leaped</span>        <span id="w126">out</span>        <span id="w127">of</span>        <span id="w128">the</span>        <span id="w129">bushes</span>        <span id="w130">and</span>        <span id="w131">tackled</span>        <span id="w132">Dug.	</span>      </span>    </p>    <p>      <span class="font-5">        <span id="w133">	&#8220;Hey!</span>        <span id="w134">That</span>        <span id="w135">is</span>        <span id="w136">the</span>        <span id="w137">bird!&#8221;</span>        <span id="w138">Dug</span>        <span id="w139">said</span>        <span id="w140">excitedly.</span>        <span id="w141">&#8220;May</span>        <span id="w142">I</span>        <span id="w143">take</span>        <span id="w144">your</span>        <span id="w145">bird</span>      </span>    </p>    <p class="no-indent">      <span class="font-5">        <span id="w146">as</span>        <span id="w147">my</span>        <span id="w148">prisoner?&#8221;</span>        <span id="w149">he</span>        <span id="w150">asked</span>        <span id="w151">Carl.</span>      </span>    </p>    <p>      <span class="font-5">        <span id="w152">	&#8220;Be</span>        <span id="w153">my</span>        <span id="w154">guest,&#8221;</span>        <span id="w155">Carl</span>        <span id="w156">said.</span>      </span>    </p>  </div><span id="empty"></span></div>
