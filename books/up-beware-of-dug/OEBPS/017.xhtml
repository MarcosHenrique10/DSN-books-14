n id="w431">Alpha</span>        <span id="w432">snarled.</span>        <span id="w433">&#8220;Why</span>        <span id="w434">do</span>        <span id="w435">I</span>        <span id="w436">not</span>        <span id="w437">have</span>        <span id="w438">a</span>        <span id="w439">surprised</span>        <span id="w440">feeling?&#8221;</span>      </span>    </p>  </div><span id="empty"></span></div>
