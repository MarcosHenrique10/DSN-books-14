    <p>
      <span class="font-5" style="color:#FFFFFF;">
        <span id="w599">	Carl,</span>
        <span id="w600">Russell,</span>
        <span id="w601">and</span>
        <span id="w602">the</span>
        <span id="w603">bird</span>
        <span id="w604">ran</span>
        <span id="w605">for</span>
        <span id="w606">their</span>
        <span id="w607">lives.</span>
        <br/>

        <span id="w609">dogs</span>
        <span id="w610">chased</span>
        <span id="w611">after</span>
        <span id="w612">them,</span>
        <span id="w613">barking</span>
        <span id="w614">angrily.</span>
      </span>
    </p>
    <p>
      <span class="font-5" style="color:#FFFFFF;">
        <span id="w615">	&#8220;Get</span>
        <span id="w616">back!&#8221;</span>

        <span id="w618">shouted</span>
        <span id="w619">at</span>
        <span id="w620">the</span>
        <span id="w621">dogs.</span>
      </span>
    </p>
    <p>
      <span class="font-5" style="color:#FFFFFF;">
        <span id="w622">	But</span>
        <span id="w623">there</span>
        <span id="w624">was</span>
        <span id="w625">no</span>
        <span id="w626">stopping</span>
        <span id="w627">the</span>
        <span id="w628">pack.</span>
