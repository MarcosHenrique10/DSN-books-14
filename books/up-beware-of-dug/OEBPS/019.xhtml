      <span class="font-5" style="color:#FFFFFF;">
        <span id="w472">	Meanwhile,</span>
        <span id="w473">the</span>
        <span id="w474">dog</span>
        <span id="w475">pack</span>

      </span>
    </p>
    <p class="no-indent">
      <span class="font-5" style="color:#FFFFFF;">
        <span id="w483">	&#8220;He</span>
        <span id="w484">has</span>
        <span id="w485">lost</span>
        <span id="w486">the</span>
        <span id="w487">bird,&#8221;</span>

        <span id="w490">&#8220;Put</span>
        <span id="w491">him</span>
        <span id="w492">in</span>
        <span id="w493">the</span>
        <span id="w494">Cone</span>
        <span id="w495">of</span>
        <span id="w496">Shame.&#8221;</span>
      </span>
    </p>
  </div>
  <div class="text-frame" style="left:364px; top:644px; width:362px; height:38px;">
    <p>
      <span class="font-5" style="color:#FFFFFF;">
        <span id="w497">	&#8220;I</span>
        <span id="w498">do</span>
        <span id="w499">not</span>
        <span id="w500">like</span>
        <span id="w501">the</span>
        <span id="w502">Cone</span>
        <span id="w503">of</span>
        <span id="w504">Shame,&#8221;</span>

        <span id="w507">hanging</span>
        <span id="w508">his</span>
        <span id="w509">head</span>
