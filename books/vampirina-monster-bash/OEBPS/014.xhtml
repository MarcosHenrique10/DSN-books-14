<p class="indent white"><span id="w398">&#x201C;We</span> <span id="w399">heard</span> <span id="w400">about</span> <span id="w401">your</span> <span id="w402">little</span> <span id="w403">costume</span> <span id="w404">party</span> <span id="w405">and</span> <span id="w406">thought</span> <span id="w407">it</span> <span id="w408">would</span> <span id="w409">be</span> <span id="w410">fun</span> <span id="w411">to</span> <span id="w412">drop<br/></span> <span id="w413">in,&#x201D;</span> <span id="w414">says</span> <span id="w415">Edna.</span></p>
