<p class="nonindent"><span id="w306">&#x201C;Don&#x2019;t</span>
<span id="w307">worry,&#x201D;</span>
<span id="w308">says</span>
<span id="w309">Vee.</span>
<span id="w310">&#x201C;I</span>
<span id="w311">made</span>
<span id="w312">regular</span>
<span id="w313">valentines,</span>
<span id="w314">too!&#x201D;</span></p>
<p class="nonindent"><span id="w315">Vee</span>
<span id="w316">is</span>
<span id="w317">excited</span>
<span id="w318">about</span>
<span id="w319">handing</span>
<span id="w320">out</span>
<span id="w321">valentines</span>
<span id="w322">for</span>
<span id="w323">the</span>
<span id="w324">first</span>

<span id="w326">ever!</span></p>
